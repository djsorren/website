<body class="home-body">

  <main class="home-main" role="main">

    <!-- ── Atmospheric background ──────────────── -->
    <div class="home-bg" aria-hidden="true">
      <img src="assets/images/home_bg.png" alt="" fetchpriority="high">
      <div class="home-bg-overlay"></div>
    </div>

    <!-- ── Artist identity ─────────────────────── -->
    <header class="home-header">
      <span class="home-overline">AI Music Artist</span>
      <h1 class="home-title" aria-label="DJ Sorren">
        <span class="title-dj">DJ</span>
        <span class="title-sorren">Sorren</span>
      </h1>
      <p class="home-tagline">Two worlds. One artist.</p>
    </header>

    <!-- ── Pipeline choice cards ───────────────── -->
    <nav class="home-choices" aria-label="Choose music pipeline" role="navigation">

      <a href="persian.html" class="choice-card choice-persian" id="choice-persian">
        <div class="choice-art-wrap" aria-hidden="true">
          <div class="choice-art persian-art"></div>
          <div class="choice-art-iris persian-iris"></div>
        </div>
        <div class="choice-body">
          <img src="assets/images/dj_sorren_persian_logo.png" alt="DJ Sorren Persian Logo" class="choice-pipeline-logo">
          <div class="choice-chip">
            <span class="chip-dot persian"></span>
            <span class="chip-text">موزیک ایرانی</span>
          </div>
          <h2 class="choice-name">Persian<br>Music</h2>
          <p class="choice-desc">Modern Persian electronic<br>dance music</p>
          <span class="choice-cta">
            Enter
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </span>
        </div>
        <div class="choice-glow persian-glow" aria-hidden="true"></div>
      </a>

      <a href="house.html" class="choice-card choice-house" id="choice-house">
        <div class="choice-art-wrap" aria-hidden="true">
          <div class="choice-art house-art"></div>
          <div class="choice-art-iris house-iris"></div>
        </div>
        <div class="choice-body">
          <img src="assets/images/dj_sorren_house_logo.png" alt="DJ Sorren House Logo" class="choice-pipeline-logo">
          <div class="choice-chip">
            <span class="chip-dot house"></span>
            <span class="chip-text">Electronic House</span>

          <p class="choice-desc">Modern electronic<br>house music</p>
          <span class="choice-cta">
            Enter
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </span>
        </div>
        <div class="choice-glow house-glow" aria-hidden="true"></div>
      </a>
